<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08080d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Заметки"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="style.css"><title>Заметки</title></head><body><div class="app"><header class="topbar"><div class="topsearch"><span>⌕</span><input id="search" placeholder="Поиск заметок..."></div><div class="topactions"><button id="settingsBtn" aria-label="Настройки">⚙</button><button id="calcBtn" aria-label="Калькулятор">＋</button><button id="theme" aria-label="Цветовая схема">◐</button><button id="calendar" aria-label="Календарь">▣</button></div></header><main>
